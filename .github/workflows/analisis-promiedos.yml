name: Analisis Promiedos (temporal)
on:
  push:
    branches: [analisis-promiedos]
    paths: [analisis/dump.js, scripts/**]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node analisis/dump.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analisis/*.json analisis/*.txt
          git commit -m "analisis: json crudo de partidos" || true
          git push
