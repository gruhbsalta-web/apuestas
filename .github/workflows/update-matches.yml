name: Update matches from Promiedos

# Las corridas programadas de GitHub se atrasan mucho (a veces horas), asi que
# en vez de muchas corridas cortas hay una corrida larga que se queda activa y
# actualiza en bucle:
#   - con partidos en juego o por empezar (desde 1 h antes): cada 5 min, con
#     vueltas livianas (solo esos partidos) y una completa cada 30 min
#   - si no: sabados y domingos cada 10 min, lunes a viernes cada 30 min,
#     adelantando la vuelta para despertar 1 h antes del proximo partido
#   - solo de 08:00 a 00:00 hora Argentina
#   (scripts/ritmo.js decide el intervalo)
# Se lanza 4 veces por dia como respaldo (08, 12, 16 y 20 hs Argentina); si ya
# hay una corriendo, la nueva espera en cola y sigue cuando termina la anterior.
on:
  schedule:
    - cron: '0 11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      una_vez:
        description: 'Actualizar una sola vez (sin bucle)'
        type: boolean
        default: false

permissions:
  contents: write

# El bucle va en un grupo; los pedidos manuales desde la app ("una vez") en otro,
# asi corren enseguida aunque el bucle este activo.
concurrency:
  group: ${{ github.event.inputs.una_vez == 'true' && 'update-once' || 'update-matches' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Actualizar en bucle
        env:
          UNA_VEZ: ${{ github.event.inputs.una_vez || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sincroniza con lo ultimo del repo (por ejemplo, un pedido manual desde la app
          # que guardo datos mientras esta vuelta procesaba). Si hay choque en los datos,
          # gana lo de esta vuelta (es lo mas nuevo); si igual no se puede, se descarta
          # esta vuelta y se sigue con la proxima, sin que el bucle quede trabado.
          sincronizar() {
            if ! git pull --rebase -X theirs -q origin master; then
              git rebase --abort 2>/dev/null || true
              git fetch -q origin master && git reset -q --hard origin/master
              return 1
            fi
          }
          inicio=$(date +%s)
          limite=$((inicio + 5*3600 + 40*60))   # dentro del maximo de 6 h de GitHub
          ultima_dur=90   # segundos que tardo la vuelta anterior (estimado inicial)
          ultimo_completo=0   # ultima vuelta completa (las rapidas solo miran los partidos en juego)
          ritmo() { node scripts/ritmo.js | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(r[process.argv[1]])})' "$1"; }
          while true; do
            vuelta_ini=$(date +%s)
            git fetch -q origin master && git reset -q --hard origin/master
            if [ "$(ritmo vivo)" = "true" ] && [ $((vuelta_ini - ultimo_completo)) -lt 1800 ] && [ "$UNA_VEZ" != "true" ]; then
              export RAPIDO=1
            else
              export RAPIDO=0; ultimo_completo=$vuelta_ini
            fi
            echo "=== Actualizacion $(TZ=America/Argentina/Buenos_Aires date '+%a %H:%M') $([ "$RAPIDO" = 1 ] && echo '(rapida)') ==="
            npm run fetch || echo "fallo fetch de partidos"
            npm run fetch:players || echo "fallo fetch de jugadores (los partidos se guardan igual)"
            # estado.json: hora de esta actualizacion y de la proxima (la app muestra la cuenta regresiva)
            ahora_e=$(date +%s)
            int_e=$(ritmo intervalo); [ -z "$int_e" ] && int_e=1800
            vivo_e=$(ritmo vivo); [ "$vivo_e" = "true" ] || vivo_e=false
            # proxima: cuando arranca la siguiente vuelta + lo que tarda procesar + ~1 min de publicacion
            prox_e=$((vuelta_ini + int_e + ultima_dur + 60))
            # pedido manual: se respeta la proxima que ya tenia anunciada el bucle
            if [ "$UNA_VEZ" = "true" ] && [ -f data/estado.json ]; then
              prev=$(node -e 'try{const e=require("./data/estado.json");process.stdout.write(String(Math.floor(new Date(e.proxima)/1000)))}catch(x){}')
              [ -n "$prev" ] && [ "$prev" -gt "$ahora_e" ] && prox_e=$prev
            fi
            if [ "$(TZ=America/Argentina/Buenos_Aires date -d @$prox_e +%H)" -lt 8 ]; then
              # fuera de horario: la proxima es a las 08:00 (hoy si todavia no pasaron, si no mañana)
              prox_e=$(TZ=America/Argentina/Buenos_Aires date -d "today 08:00" +%s)
              [ "$ahora_e" -ge "$prox_e" ] && prox_e=$(TZ=America/Argentina/Buenos_Aires date -d "tomorrow 08:00" +%s)
            fi
            printf '{"ultima":"%s","proxima":"%s","intervaloMin":%d,"vivo":%s}\n' \
              "$(date -u -d @$ahora_e +%Y-%m-%dT%H:%M:%SZ)" "$(date -u -d @$prox_e +%Y-%m-%dT%H:%M:%SZ)" $((int_e/60)) "$vivo_e" > data/estado.json
            git add data/*.json || true
            if git commit -q -m "chore: update matches.json y players.json (promiedos)"; then
              if sincronizar; then
                git push -q || { sincronizar && git push -q; } || echo "no se pudo subir, se reintenta en la proxima vuelta"
              else
                echo "choque con otra actualizacion: se descarta esta vuelta"
              fi
            else
              echo "sin cambios"
            fi
            [ "$UNA_VEZ" = "true" ] && break
            hora=$(TZ=America/Argentina/Buenos_Aires date +%H)
            intervalo=$int_e
            ahora=$(date +%s)
            ultima_dur=$((ahora - vuelta_ini))
            echo "Vuelta en ${ultima_dur}s"
            # fuera de horario (00:00 a 07:59 Argentina) o cerca del limite de tiempo: terminar
            if [ "$hora" -lt 8 ] || [ $((ahora + intervalo)) -ge "$limite" ]; then
              echo "Fin del bucle (hora $hora, limite de tiempo o fuera de horario)"
              break
            fi
            # ritmo fijo: la proxima vuelta arranca intervalo segundos despues del inicio de esta
            espera=$((vuelta_ini + intervalo - $(date +%s)))
            [ "$espera" -lt 30 ] && espera=30
            sleep "$espera"
          done
