name: Update matches from API-Sports

on:
  schedule:
    - cron: '0 3 * * *' # every day at 03:00 UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Fetch matches
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: npm run fetch
      - name: Commit matches.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json || true
          git commit -m "chore: update matches.json (api-sports)" || echo "no changes to commit"
          git push
