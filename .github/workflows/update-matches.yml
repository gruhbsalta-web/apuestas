name: Update matches from Promiedos

on:
  schedule:
    # Cada 30 min de 08:00 a 00:00 hora Argentina (11:00-03:00 UTC),
    # asi los resultados y estadisticas se actualizan solos durante los partidos
    # (incluye los de Europa de la mañana).
    - cron: '*/30 0-2,11-23 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# nunca dos corridas a la vez (se pisarian los commits)
concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Fetch matches
        run: npm run fetch
      - name: Fetch players (planteles, DT y ausentes)
        # si falla no frena la actualizacion de partidos
        continue-on-error: true
        run: npm run fetch:players
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/players.json || true
          git commit -m "chore: update matches.json y players.json (promiedos)" || echo "no changes to commit"
          git pull --rebase --autostash origin master || true
          git push
