name: Update matches from Promiedos

on:
  schedule:
    # De 08:00 a 00:00 hora Argentina (11:00-03:00 UTC):
    # - sabados y domingos (mas partidos) cada 10 min
    # - lunes a viernes cada 30 min
    # Las horas 00-02 UTC son 21:00-23:59 del dia ANTERIOR en Argentina,
    # por eso esos tramos usan el dia de la semana siguiente.
    - cron: '*/10 11-23 * * 6,0'   # sab y dom 08:00-20:50
    - cron: '*/10 0-2 * * 0,1'     # sab y dom 21:00-23:50
    - cron: '*/30 11-23 * * 1-5'   # lun a vie 08:00-20:30
    - cron: '*/30 0-2 * * 2-6'     # lun a vie 21:00-23:30
    - cron: '0 3 * * *'            # todos los dias 00:00
  workflow_dispatch: {}

permissions:
  contents: write

# nunca dos corridas a la vez (se pisarian los commits)
concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Fetch matches
        run: npm run fetch
      - name: Fetch players (planteles, DT y ausentes)
        # si falla no frena la actualizacion de partidos
        continue-on-error: true
        run: npm run fetch:players
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json data/players.json data/teams.json || true
          git commit -m "chore: update matches.json y players.json (promiedos)" || echo "no changes to commit"
          git pull --rebase --autostash origin master || true
          git push
