name: Update matches from Promiedos

# Las corridas programadas de GitHub se atrasan mucho (a veces horas), asi que
# en vez de muchas corridas cortas hay una corrida larga que se queda activa y
# actualiza en bucle:
#   - sabados y domingos cada 10 min
#   - lunes a viernes cada 30 min
#   - solo de 08:00 a 00:00 hora Argentina
# Se lanza 4 veces por dia como respaldo (08, 12, 16 y 20 hs Argentina); si ya
# hay una corriendo, la nueva espera en cola y sigue cuando termina la anterior.
on:
  schedule:
    - cron: '0 11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      una_vez:
        description: 'Actualizar una sola vez (sin bucle)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Actualizar en bucle
        env:
          UNA_VEZ: ${{ github.event.inputs.una_vez || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          inicio=$(date +%s)
          limite=$((inicio + 5*3600 + 40*60))   # dentro del maximo de 6 h de GitHub
          while true; do
            echo "=== Actualizacion $(TZ=America/Argentina/Buenos_Aires date '+%a %H:%M') ==="
            git pull --rebase --autostash -q origin master || true
            npm run fetch || echo "fallo fetch de partidos"
            npm run fetch:players || echo "fallo fetch de jugadores (los partidos se guardan igual)"
            # estado.json: hora de esta actualizacion y de la proxima (la app muestra la cuenta regresiva)
            ahora_e=$(date +%s)
            dia_e=$(TZ=America/Argentina/Buenos_Aires date +%u)
            if [ "$dia_e" -ge 6 ]; then int_e=600; else int_e=1800; fi
            prox_e=$((ahora_e + int_e))
            if [ "$(TZ=America/Argentina/Buenos_Aires date -d @$prox_e +%H)" -lt 8 ]; then
              # fuera de horario: la proxima es a las 08:00 (hoy si todavia no pasaron, si no mañana)
              prox_e=$(TZ=America/Argentina/Buenos_Aires date -d "today 08:00" +%s)
              [ "$ahora_e" -ge "$prox_e" ] && prox_e=$(TZ=America/Argentina/Buenos_Aires date -d "tomorrow 08:00" +%s)
            fi
            printf '{"ultima":"%s","proxima":"%s","intervaloMin":%d}\n' \
              "$(date -u -d @$ahora_e +%Y-%m-%dT%H:%M:%SZ)" "$(date -u -d @$prox_e +%Y-%m-%dT%H:%M:%SZ)" $((int_e/60)) > data/estado.json
            git add data/*.json || true
            if git commit -q -m "chore: update matches.json y players.json (promiedos)"; then
              git pull --rebase --autostash -q origin master || true
              git push -q || echo "no se pudo subir, se reintenta en la proxima vuelta"
            else
              echo "sin cambios"
            fi
            [ "$UNA_VEZ" = "true" ] && break
            hora=$(TZ=America/Argentina/Buenos_Aires date +%H)
            dia=$(TZ=America/Argentina/Buenos_Aires date +%u)   # 6 sabado, 7 domingo
            if [ "$dia" -ge 6 ]; then intervalo=600; else intervalo=1800; fi
            ahora=$(date +%s)
            # fuera de horario (00:00 a 07:59 Argentina) o cerca del limite de tiempo: terminar
            if [ "$hora" -lt 8 ] || [ $((ahora + intervalo)) -ge "$limite" ]; then
              echo "Fin del bucle (hora $hora, limite de tiempo o fuera de horario)"
              break
            fi
            sleep "$intervalo"
          done
