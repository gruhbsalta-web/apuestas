name: Cargar temporada anterior
# Corrida aparte para bajar de una vez la temporada anterior de las ligas europeas
# (data/temporada_anterior.json), sin frenar el bucle de actualización.
on:
  workflow_dispatch:
    inputs:
      ligas:
        description: 'Ligas (ids de Promiedos separados por coma: h=Premier, bb=La Liga, bh=Serie A)'
        default: 'h'
permissions:
  contents: write
concurrency:
  group: cargar-anterior
jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Bajar temporada anterior
        env:
          SOLO_ANTERIOR: '1'
          LIGAS: ${{ github.event.inputs.ligas }}
          PROMIEDOS_DELAY_MS: '100'
        run: |
          # partir de lo que ya haya guardado (rama datos)
          if git fetch -q origin datos; then git checkout FETCH_HEAD -- data/temporada_anterior.json 2>/dev/null || true; fi
          node scripts/fetch_promiedos.js
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/temporada_anterior.json /tmp/ta.json
          for i in 1 2 3 4 5; do
            git fetch -q origin master && git reset -q --hard origin/master
            cp /tmp/ta.json data/temporada_anterior.json
            git add data/temporada_anterior.json
            git commit -q -m "chore: temporada anterior (${{ github.event.inputs.ligas }})" || break
            git push -q origin HEAD:master && break
            sleep 5
          done
